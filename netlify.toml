[build]
  command = "npm run build"
  publish = "dist"
  # Skip the deploy when a commit only touches AI job markers (see netlify/functions/lib/jobs.ts).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)ai-jobs'"

[build.environment]
  NODE_VERSION = "24"
  # ALLOWED_EDITORS holds public GitHub usernames, not a secret.
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_EDITORS"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

# ---------------------------------------------------------------------------
# Old Hugo URLs. /posts/<slug>/ and /categories/<name>/ are unchanged pages;
# these cover the rest so no old link 404s.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/posts/page/1/"
  to = "/posts/"
  status = 301

[[redirects]]
  # Hugo showed 10 posts per page (4 pages); the new design shows 12 (3 pages).
  from = "/posts/page/4/"
  to = "/posts/page/3/"
  status = 301

[[redirects]]
  from = "/categories/"
  to = "/posts/"
  status = 301

[[redirects]]
  from = "/categories/index.xml"
  to = "/index.xml"
  status = 301

[[redirects]]
  from = "/pages/"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/pages/index.xml"
  to = "/index.xml"
  status = 301

[[redirects]]
  # Hugo's sitemap URL (already submitted to search engines) → Astro's sitemap index.
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/pages/about/"
  to = "/about/"
  status = 301

# The AI drafting page moved into the Sveltia CMS editor (/admin).
[[redirects]]
  from = "/admin/ai"
  to = "/admin/"
  status = 302

[[redirects]]
  from = "/admin/ai/"
  to = "/admin/"
  status = 302

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Sveltia CMS (/admin) loads from unpkg, talks to GitHub and Netlify's OAuth,
    # and fetches its icon font from cdn.jsdelivr.net; one policy covers both the
    # site and the admin so the two never conflict.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://api.github.com https://*.githubusercontent.com https://api.netlify.com https://unpkg.com; frame-src 'self' https://www.youtube-nocookie.com; worker-src 'self' blob:; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
