# Sveltia CMS — https://sveltiacms.app/en/docs
# Fields mirror src/lib/post-schema.ts exactly; the build fails on anything else.

backend:
  name: github
  repo: MujahidEmon/blog-pgb
  branch: main
  # Login uses Netlify's GitHub OAuth provider (no base_url = Netlify default).

# Saves become cms/* branches + pull requests; "Publish" merges into main.
publish_mode: editorial_workflow

# One editor pane, no side-by-side preview: the preview only repeated the field
# labels and made the form feel denser than it is.
editor:
  preview: false
  second_pane: false

site_url: https://abuaaisha.com
display_url: https://abuaaisha.com
logo_url: /favicon.svg

media_folder: public/images/posts
public_folder: /images/posts

media_libraries:
  default:
    config:
      max_file_size: 8000000
      # Uploads are converted in the browser: WebP, at most 1600px wide (same as the AI pipeline).
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 1600
          height: 1600

collections:
  - name: posts
    label: লেখা
    label_singular: লেখা
    folder: src/content/posts
    extension: md
    format: frontmatter
    create: true
    delete: false # never delete a published post — unpublish (draft) or redirect instead
    slug:
      editable: [create]
      hint: "ফাইলের নাম = URL। নিয়ম: ৩ অঙ্কের ক্রম + বিভাগ অক্ষর (f/s/w) + বিভাগের ক্রম, যেমন 033s22"
      pattern: ['^\d{3}[fsw]\d{2}$', "যেমন 033s22 — ৩টি অঙ্ক, f/s/w, তারপর ২টি অঙ্ক"]
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - label: খসড়া
        field: draft
        pattern: true
      - label: প্রকাশিত
        field: draft
        pattern: false
      - label: AI খসড়া
        field: aiGenerated
        pattern: true
    fields:
      # Rendered by /admin/ai-panel.js. Never saved: the preSave hook strips it,
      # and the generated post is committed by the Netlify function instead.
      - { name: aiDraft, label: "AI সহায়ক", widget: ai-start, required: false }
      - { name: title, label: শিরোনাম, widget: string }
      - name: summary
        label: সংক্ষিপ্ত সারাংশ
        widget: text
        hint: "হোম ও ব্লগ কার্ডে দেখানো এক-দুই বাক্য"
      - name: categories
        label: বিভাগ
        widget: select
        multiple: true
        min: 1
        options:
          - { label: ঈমান (faith), value: faith }
          - { label: সমাজ (social), value: social }
          - { label: বিশ্বদৃষ্টি (worldview), value: worldview }
      - name: date
        label: প্রকাশের তারিখ
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - { name: body, label: লেখা, widget: markdown }
      - { name: image, label: কভার ছবি, widget: image, required: false }
      - name: imageAlt
        label: "ছবির বর্ণনা (alt) — ছবি থাকলে আবশ্যক"
        widget: string
        required: false
      - { name: description, label: "দীর্ঘ সারাংশ (SEO)", widget: text, required: false }
      - name: sources
        label: "তথ্যসূত্র — প্রতিটি লিংক খুলে যাচাই করুন"
        widget: list
        required: false
        fields:
          - { name: title, label: শিরোনাম, widget: string }
          - { name: url, label: লিংক, widget: string }
      - name: draft
        label: "খসড়া (চালু থাকলে সাইটে প্রকাশ হবে না)"
        widget: boolean
        default: true
        hint: "প্রকাশ করতে চাইলে এটি বন্ধ করুন"
      - name: lang
        label: ভাষা
        widget: select
        default: bn
        options:
          - { label: বাংলা, value: bn }
          - { label: English, value: en }
      - name: aiGenerated
        label: "AI দিয়ে তৈরি"
        widget: boolean
        required: false
        hint: "AI খসড়া তৈরি করলে স্বয়ংক্রিয়ভাবে সেট হয়; সাধারণত হাত দিতে হবে না"

  - name: pages
    label: পাতা
    files:
      - name: about
        label: পরিচিতি
        file: src/content/pages/about.md
        fields:
          - { name: title, label: শিরোনাম, widget: string }
          - { name: description, label: সংক্ষিপ্ত পরিচিতি, widget: text, required: false }
          - { name: body, label: লেখা, widget: markdown }
